name: Verify

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.FSM_REST.slnx

      - name: Build
        run: dotnet build TheSingularityWorkshop.FSM_REST.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test tests/FSM_REST.Tests/FSM_REST.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage;Format=cobertura"
          --results-directory ./TestResults
          --logger "trx;LogFileName=testresults.trx"

      - name: Pack
        run: dotnet pack src/FSM_REST/FSM_REST.csproj --configuration Release --no-build --output ./artifacts

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: fsm-rest-nuget-package
          path: ./artifacts/*.nupkg

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: fsm-rest-test-results
          path: ./TestResults/*
