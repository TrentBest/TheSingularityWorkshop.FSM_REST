name: CiAi Commit Evidence

on:
  push:
    branches: [development, master]

permissions:
  contents: read
  actions: read

concurrency:
  group: ciai-fsm-rest-evidence-${{ github.sha }}
  cancel-in-progress: false

jobs:
  observe:
    name: Observe exact FSM_REST build run
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Validate source identity
        id: source
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
          PUSHED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REPOSITORY" == "TrentBest/TheSingularityWorkshop.FSM_REST" ]]
          [[ "$TARGET_BRANCH" == "development" || "$TARGET_BRANCH" == "master" ]]
          [[ "$PUSHED_REF" == "refs/heads/$TARGET_BRANCH" ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "repository=$TARGET_REPOSITORY"
            echo "branch=$TARGET_BRANCH"
            echo "sha=$TARGET_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve exact authoritative build run and attempt
        id: source-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ steps.source.outputs.repository }}
          TARGET_BRANCH: ${{ steps.source.outputs.branch }}
          TARGET_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$TARGET_REPOSITORY/actions/workflows/build.yml/runs"
          for poll in $(seq 1 90); do
            response="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api?branch=$TARGET_BRANCH&event=push&head_sha=$TARGET_SHA&per_page=100")"
            matches="$(jq --arg repo "$TARGET_REPOSITORY" --arg branch "$TARGET_BRANCH" --arg sha "$TARGET_SHA" '
              [.workflow_runs[]
                | select(.head_sha == $sha)
                | select(.event == "push" and .head_branch == $branch)
                | select((.path | split("@")[0]) == ".github/workflows/build.yml")
                | select(.head_repository.full_name == $repo)]
            ' <<< "$response")"
            count="$(jq 'length' <<< "$matches")"
            if [ "$count" -gt 1 ]; then
              echo "::error::Multiple authoritative build.yml push runs match this exact source SHA."
              jq -r '.[] | "run_id=\(.id) attempt=\(.run_attempt) status=\(.status)"' <<< "$matches"
              exit 1
            fi
            if [ "$count" -eq 1 ] && [ "$(jq -r '.[0].status' <<< "$matches")" = "completed" ]; then
              run_id="$(jq -r '.[0].id' <<< "$matches")"
              run_attempt="$(jq -r '.[0].run_attempt' <<< "$matches")"
              conclusion="$(jq -r '.[0].conclusion // "none"' <<< "$matches")"
              run_url="$(jq -r '.[0].html_url' <<< "$matches")"
              [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
              [[ "$run_attempt" =~ ^[1-9][0-9]*$ ]]
              {
                echo "run_id=$run_id"
                echo "run_attempt=$run_attempt"
                echo "conclusion=$conclusion"
                echo "run_url=$run_url"
                echo "selector=.github/workflows/build.yml#$run_id#$run_attempt"
              } >> "$GITHUB_OUTPUT"
              echo "Resolved exact FSM_REST build run $run_id attempt $run_attempt ($conclusion)."
              exit 0
            fi
            echo "Waiting for exact FSM_REST build run (poll $poll/90; matches=$count)."
            sleep 20
          done
          echo "::error::Timed out waiting for the exact build.yml push run for $TARGET_SHA."
          exit 1

      - name: Check out pinned CiAi observer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrentBest/TheSingularityWorkshop.CiAi
          ref: 49a802fcab60fa7411b01892072d7e2c8a2c72a9
          path: _tools/CiAi
          submodules: recursive
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.x

      - name: Restore pinned observer
        working-directory: _tools/CiAi
        run: dotnet restore samples/TheSingularityWorkshop.CiAi.ObserveRun/TheSingularityWorkshop.CiAi.ObserveRun.csproj

      - name: Build pinned observer
        working-directory: _tools/CiAi
        run: dotnet build samples/TheSingularityWorkshop.CiAi.ObserveRun/TheSingularityWorkshop.CiAi.ObserveRun.csproj --configuration Release --no-restore

      - name: Observe and validate exact FSM_REST evidence
        working-directory: _tools/CiAi
        shell: bash
        env:
          CIAI_GITHUB_TOKEN: ${{ github.token }}
          CIAI_REQUIRED_WORKFLOW_PATHS: ${{ steps.source-run.outputs.selector }}
          TARGET_REPOSITORY: ${{ steps.source.outputs.repository }}
          TARGET_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.source-run.outputs.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source-run.outputs.run_attempt }}
          SOURCE_RUN_CONCLUSION: ${{ steps.source-run.outputs.conclusion }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          dotnet run --project samples/TheSingularityWorkshop.CiAi.ObserveRun --configuration Release --no-build -- \
            "$TARGET_REPOSITORY" "$TARGET_SHA" artifacts/commit-observation.json
          observer_exit_code=$?
          set -e
          echo "CiAi observer exit code: $observer_exit_code"
          expected=".github/workflows/build.yml#$SOURCE_RUN_ID#$SOURCE_RUN_ATTEMPT"
          jq -e --arg repo "$TARGET_REPOSITORY" --arg sha "$TARGET_SHA" --arg expected "$expected" '
            .schema == "ciai.commit-observation.v2" and
            .repository == $repo and
            .headSha == $sha and
            .discoveryComplete == true and
            .complete == true and
            (.requiredWorkflowResults | length) == 1 and
            .requiredWorkflowResults[0].WorkflowPath == $expected and
            .requiredWorkflowResults[0].State == "passed" and
            .requiredWorkflowResults[0].EvidenceComplete == true and
            .requiredWorkflowResults[0].Terminal == true and
            .requiredWorkflowResults[0].Successful == true
          ' artifacts/commit-observation.json >/dev/null
          echo "CiAi verified exact FSM_REST run $SOURCE_RUN_ID attempt $SOURCE_RUN_ATTEMPT ($SOURCE_RUN_CONCLUSION)."

      - name: Upload JSON and Markdown evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ciai-fsm-rest-evidence-${{ github.sha }}
          path: |
            _tools/CiAi/artifacts/commit-observation.json
            _tools/CiAi/artifacts/commit-observation.md
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize exact source provenance
        if: ${{ always() }}
        env:
          REPOSITORY: ${{ steps.source.outputs.repository }}
          BRANCH: ${{ steps.source.outputs.branch }}
          SHA: ${{ steps.source.outputs.sha }}
          RUN_ID: ${{ steps.source-run.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.source-run.outputs.run_attempt }}
          RUN_URL: ${{ steps.source-run.outputs.run_url }}
          RUN_CONCLUSION: ${{ steps.source-run.outputs.conclusion }}
          OBSERVER_STATUS: ${{ job.status }}
        shell: bash
        run: |
          report="_tools/CiAi/artifacts/commit-observation.json"
          policy_state="not-produced"
          if [ -s "$report" ]; then
            policy_state="$(jq -r '.requiredWorkflowResults[0].State // "unknown"' "$report")"
          fi
          {
            echo "## CiAi FSM_REST exact commit evidence"
            echo
            printf -- '- Repository: `%s`\n' "$REPOSITORY"
            printf -- '- Branch: `%s`\n' "$BRANCH"
            printf -- '- Source SHA: `%s`\n' "$SHA"
            echo "- Authoritative build run: ${RUN_URL:-not uniquely resolved}"
            echo "- Run ID / attempt: ${RUN_ID:-unknown} / ${RUN_ATTEMPT:-unknown}"
            echo "- Provider conclusion: $RUN_CONCLUSION"
            echo "- CiAi policy state: $policy_state"
            echo "- Observer lane: **$OBSERVER_STATUS**"
            echo
            echo "Read-only evidence only. NuGet publication remains behind the existing explicit manual gate; no release or deployment is authorized by this report."
          } >> "$GITHUB_STEP_SUMMARY"
