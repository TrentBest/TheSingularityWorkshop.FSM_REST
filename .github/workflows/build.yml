name: Package FSM REST

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the already-verified package to NuGet.org"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.FSM_REST.slnx

      - name: Build
        run: dotnet build TheSingularityWorkshop.FSM_REST.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test tests/FSM_REST.Tests/FSM_REST.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage;Format=cobertura"
          --results-directory ./TestResults
          --logger "trx;LogFileName=testresults.trx"

      - name: Prepare coverage report
        shell: bash
        run: |
          set -euo pipefail
          coverage_file="$(find ./TestResults -type f -name 'coverage.cobertura.xml' -print -quit)"
          if [[ -z "$coverage_file" ]]; then
            echo "No coverage.cobertura.xml file was produced."
            find ./TestResults -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$coverage_file" ./TestResults/coverage.cobertura.xml
          echo "Prepared coverage report: $coverage_file"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TrentBest/TheSingularityWorkshop.FSM_REST
          files: ./TestResults/coverage.cobertura.xml
          fail_ci_if_error: true

      - name: Pack
        run: dotnet pack src/FSM_REST/FSM_REST.csproj --configuration Release --no-build --output ./artifacts

      - name: Validate stable package dependency gate
        shell: python
        run: |
          import glob
          import zipfile
          import xml.etree.ElementTree as ET

          failures = []
          for package_path in glob.glob("artifacts/*.nupkg"):
              with zipfile.ZipFile(package_path) as package:
                  nuspec_name = next(name for name in package.namelist() if name.endswith(".nuspec"))
                  root = ET.fromstring(package.read(nuspec_name))

              ns = {"n": "http://schemas.microsoft.com/packaging/2013/05/nuspec.xsd"}
              version = root.findtext("n:metadata/n:version", namespaces=ns) or ""
              if "-" in version:
                  continue

              for dependency in root.findall("n:metadata/n:dependencies//n:dependency", namespaces=ns):
                  dependency_version = dependency.attrib.get("version", "")
                  if "-" in dependency_version:
                      failures.append(
                          f"{version} contains prerelease dependency "
                          f"{dependency.attrib.get('id')} {dependency_version}"
                      )

          if failures:
              print("Stable package dependency gate failed:")
              for failure in failures:
                  print(f" - {failure}")
              raise SystemExit(1)

          print("Stable package dependency gate passed.")

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: fsm-rest-nuget-package
          path: ./artifacts/*.nupkg

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fsm-rest-test-results
          path: ./TestResults/*

  publish_nuget:
    needs: build-and-test
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: fsm-rest-nuget-package
          path: ./artifacts

      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: TheSingularityWorkshop

      - name: Publish package to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
