name: Package FSM REST

on:
  pull_request:
  push:
    branches:
      - master
      - development
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified packages to NuGet.org'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check documentation contract
        run: python3 scripts/check_documentation.py

      - name: Check architecture boundaries
        run: python3 scripts/check_architecture.py

      - name: Check UML links and image paths
        run: python3 scripts/check_uml_links.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.FSM_REST.slnx

      - name: Build
        run: dotnet build TheSingularityWorkshop.FSM_REST.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test tests/FSM_REST.Tests/FSM_REST.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage;Format=cobertura"
          --results-directory ./TestResults
          --logger "trx;LogFileName=testresults.trx"

      - name: Run deterministic end-to-end demo
        run: dotnet run --project samples/RestCapabilityDemo/RestCapabilityDemo.csproj --configuration Release --no-build

      - name: Build storefront composition sample
        run: dotnet build samples/StorefrontComparison/StorefrontComparison.csproj --configuration Release

      - name: Run deterministic storefront composition proof
        run: dotnet run --project samples/StorefrontComparison/StorefrontComparison.csproj --configuration Release --no-build

      - name: Build credential-gated CoderLegion sample
        run: dotnet build samples/CoderLegionArticleLibrary/CoderLegionArticleLibrary.csproj --configuration Release

      - name: Prepare coverage report
        shell: bash
        run: |
          set -euo pipefail
          coverage_file="$(find ./TestResults -type f -name 'coverage.cobertura.xml' -print -quit)"
          if [[ -z "$coverage_file" ]]; then
            echo "No coverage.cobertura.xml file was produced."
            find ./TestResults -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$coverage_file" ./TestResults/coverage.cobertura.xml
          echo "Prepared coverage report: $coverage_file"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TrentBest/TheSingularityWorkshop.FSM_REST
          files: ./TestResults/coverage.cobertura.xml
          fail_ci_if_error: true

      - name: Pack
        run: |
          dotnet pack src/FSM_REST/FSM_REST.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/FSM_REST.OpenApi/FSM_REST.OpenApi.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/FSM_REST.COS/FSM_REST.COS.csproj --configuration Release --no-build --output ./artifacts

      - name: Audit packed NuGet artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import posixpath
          import re
          import urllib.parse
          import zipfile
          from xml.etree import ElementTree as ET

          expected = {
              "TheSingularityWorkshop.FSM_Rest": {
                  "version": "0.1.0-alpha.5",
                  "dll_prefix": "lib/net8.0/",
                  "required_files": ["README.md", "LICENSE.txt"],
                  "required_dependencies": ["TheSingularityWorkshop.FSM_API"],
                  "forbidden_dependencies": ["TheSingularityWorkshop.MicroBundleDomain", "TheSingularityWorkshop.FSM_COS"],
              },
              "TheSingularityWorkshop.FSM_Rest.OpenApi": {
                  "version": "0.1.0-alpha.1",
                  "dll_prefix": "lib/net8.0/",
                  "required_files": ["README.md", "LICENSE.txt"],
                  "required_dependencies": ["TheSingularityWorkshop.FSM_Rest"],
              },
              "TheSingularityWorkshop.FSM_Rest.COS": {
                  "version": "0.1.0-alpha.1",
                  "dll_prefix": "lib/net8.0/",
                  "required_files": ["README.md", "LICENSE.txt"],
                  "required_dependencies": ["TheSingularityWorkshop.MicroBundleDomain", "TheSingularityWorkshop.FSM_Rest"],
              },
          }
          packages = glob.glob("artifacts/*.nupkg")
          if len(packages) != len(expected):
              raise SystemExit(f"Expected {len(expected)} NuGet packages, found {len(packages)}: {packages}")

          found = set()
          for package in packages:
              with zipfile.ZipFile(package) as archive:
                  names = archive.namelist()
                  lower_names = {name.lower() for name in names}
                  nuspec_paths = [name for name in names if name.lower().endswith(".nuspec")]
                  if len(nuspec_paths) != 1:
                      raise SystemExit(f"{package}: expected exactly one .nuspec, found {nuspec_paths}")
                  root = ET.fromstring(archive.read(nuspec_paths[0]))
                  metadata = root.find(".//{*}metadata")
                  if metadata is None:
                      raise SystemExit(f"{package}: nuspec metadata is missing")

                  def value(tag):
                      node = metadata.find("{*}" + tag)
                      return node.text.strip() if node is not None and node.text else ""

                  package_id = value("id")
                  if package_id not in expected:
                      raise SystemExit(f"{package}: unexpected package id {package_id!r}")
                  if package_id in found:
                      raise SystemExit(f"Duplicate package id: {package_id}")
                  found.add(package_id)
                  rule = expected[package_id]
                  package_version = value("version")
                  if package_version != rule["version"]:
                      raise SystemExit(f"{package_id}: expected version {rule['version']}, got {package_version}")
                  expected_filename = f"{package_id}.{package_version}.nupkg"
                  if package.rsplit("/", 1)[-1].lower() != expected_filename.lower():
                      raise SystemExit(f"{package}: filename does not match package metadata; expected {expected_filename}")
                  missing = [required for required in rule["required_files"] if required.lower() not in lower_names]
                  if missing:
                      raise SystemExit(f"{package_id}: missing required package files: {missing}")
                  internal_docs = [
                      "docs/BRANCH_RECONCILIATION.md",
                      "docs/DOMAIN_GAP_ASSESSMENT.md",
                      "docs/FSM_REST.DOCUMENTATION_READINESS.md",
                      "docs/RELEASE_CHECKLIST.md",
                  ]
                  leaked_docs = [path for path in internal_docs if path.lower() in lower_names]
                  if leaked_docs:
                      raise SystemExit(f"{package_id}: internal repository-maintenance docs must not ship: {leaked_docs}")

                  readme_path = next((name for name in names if name.lower() == "readme.md"), None)
                  if readme_path:
                      readme_text = archive.read(readme_path).decode("utf-8")
                      targets = re.findall(r'(?<!!)\[[^\]]*\]\(([^)]+)\)', readme_text)
                      targets += re.findall(r'!\[[^\]]*\]\(([^)]+)\)', readme_text)
                      targets += re.findall(r'\b(?:href|src)=["\']([^"\']+)["\']', readme_text)
                      for target in targets:
                          target = target.strip().split()[0].strip("<>")
                          parsed = urllib.parse.urlsplit(target)
                          if parsed.scheme or target.startswith("//") or target.startswith("#"):
                              continue
                          relative_path = urllib.parse.unquote(parsed.path)
                          if not relative_path:
                              continue
                          resolved_path = posixpath.normpath(posixpath.join(posixpath.dirname(readme_path), relative_path))
                          if resolved_path.lower() not in lower_names:
                              raise SystemExit(f"{package_id}: README link target is not packaged: {target} -> {resolved_path}")
                  if not any(name.startswith(rule["dll_prefix"]) and name.endswith(".dll") for name in names):
                      raise SystemExit(f"{package_id}: missing net8.0 assembly")
                  if not any(name.startswith(rule["dll_prefix"]) and name.endswith(".xml") for name in names):
                      raise SystemExit(f"{package_id}: missing XML API documentation")
                  if not (value("license") or value("licenseUrl")):
                      raise SystemExit(f"{package_id}: license metadata is missing")
                  dependencies = [node.attrib.get("id", "") for node in metadata.findall(".//{*}dependency")]
                  for forbidden in rule.get("forbidden_dependencies", []):
                      if any(dep.lower() == forbidden.lower() for dep in dependencies):
                          raise SystemExit(f"{package_id}: core package has forbidden dependency {forbidden}")
                  for required in rule.get("required_dependencies", []):
                      if not any(dep.lower() == required.lower() for dep in dependencies):
                          raise SystemExit(f"{package_id}: missing expected dependency {required}")
                  print(f"PASS: {package_id} {value('version')} — assembly, XML docs, README, license, and dependency boundary verified")

          if found != set(expected):
              raise SystemExit(f"Expected package IDs {sorted(expected)}, found {sorted(found)}")
          PY

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: fsm-rest-nuget-package
          path: ./artifacts/*.nupkg

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fsm-rest-test-results
          path: ./TestResults/*

  source-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout FSM_REST
        uses: actions/checkout@v7
        with:
          path: FSM_REST

      - name: Checkout MicroBundleDomain source
        uses: actions/checkout@v7
        with:
          repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
          ref: development
          path: TheSingularityWorkshop.MicroBundleDomain

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore source-integrated solution
        working-directory: FSM_REST
        run: dotnet restore TheSingularityWorkshop.FSM_REST.slnx -p:WorkshopUseRepositorySources=true

      - name: Build source-integrated solution
        working-directory: FSM_REST
        run: dotnet build TheSingularityWorkshop.FSM_REST.slnx --configuration Release --no-restore -p:WorkshopUseRepositorySources=true

      - name: Test source-integrated solution
        working-directory: FSM_REST
        run: dotnet test TheSingularityWorkshop.FSM_REST.slnx --configuration Release --no-build -p:WorkshopUseRepositorySources=true

  publish_nuget:
    needs: [build-and-test, source-integration]
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/development' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: fsm-rest-nuget-package
          path: ./artifacts

      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: TheSingularityWorkshop

      - name: Publish packages to NuGet.org
        run: |
          for package in ./artifacts/*.nupkg; do
            dotnet nuget push "$package" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
          done
