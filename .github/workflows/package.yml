name: Publish NuGet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.FSM_REST.slnx

      - name: Build
        run: dotnet build TheSingularityWorkshop.FSM_REST.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test tests/FSM_REST.Tests/FSM_REST.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal

      - name: Pack
        run: >
          dotnet pack src/FSM_REST/FSM_REST.csproj
          --configuration Release
          --no-build
          --output ./artifacts

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate
