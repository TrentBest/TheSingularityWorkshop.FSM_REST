<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">FSM_REST capability lifecycle</title><desc id="desc">A reusable operation descriptor is bound with invocation values, converted to a request, sent through a replaceable transport, and returned as a response for domain interpretation.</desc><defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#18212f}.h{font-size:18px;font-weight:700}.b{font-size:14px}.s{font-size:12px;fill:#465466}.n{fill:#f5f8fc;stroke:#58799d;stroke-width:2}.g{fill:#e2f2ed;stroke:#2f806b;stroke-width:2}.y{fill:#fff0d9;stroke:#b16c16;stroke-width:2}.l{stroke:#58799d;stroke-width:2.5;fill:none}.p{fill:#2f806b;animation:move 6s ease-in-out infinite}@keyframes move{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(800px);opacity:0}}@media(prefers-reduced-motion:reduce){.p{animation:none;display:none}}</style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#58799d"/></marker></defs><rect x="18" y="52" width="175" height="110" rx="12" class="g"/><text x="105" y="83" text-anchor="middle" class="h">Descriptor</text><text x="105" y="109" text-anchor="middle" class="b">Reusable recipe</text><text x="105" y="134" text-anchor="middle" class="s">method / path / rules</text><path d="M193 107H212" class="l" marker-end="url(#a)"/><rect x="219" y="52" width="150" height="110" rx="12" class="n"/><text x="294" y="83" text-anchor="middle" class="h">Binding</text><text x="294" y="109" text-anchor="middle" class="b">Per-call values</text><text x="294" y="134" text-anchor="middle" class="s">input snapshot</text><path d="M369 107H388" class="l" marker-end="url(#a)"/><rect x="395" y="52" width="145" height="110" rx="12" class="n"/><text x="467" y="83" text-anchor="middle" class="h">Request</text><text x="467" y="109" text-anchor="middle" class="b">Concrete message</text><text x="467" y="134" text-anchor="middle" class="s">URI / headers / body</text><path d="M540 107H559" class="l" marker-end="url(#a)"/><rect x="566" y="52" width="150" height="110" rx="12" class="y"/><text x="641" y="83" text-anchor="middle" class="h">Transport</text><text x="641" y="109" text-anchor="middle" class="b">Communication</text><text x="641" y="134" text-anchor="middle" class="s">replaceable adapter</text><path d="M716 107H735" class="l" marker-end="url(#a)"/><rect x="742" y="52" width="240" height="110" rx="12" class="g"/><text x="862" y="83" text-anchor="middle" class="h">Response + consumer</text><text x="862" y="109" text-anchor="middle" class="b">Observed result</text><text x="862" y="134" text-anchor="middle" class="s">interpret domain meaning</text><path d="M80 211H920" class="l" stroke-dasharray="6 6"/><circle cx="0" cy="211" r="7" class="p"/><text x="500" y="250" text-anchor="middle" class="b">Stable capability metadata is not the changing remote payload.</text><text x="500" y="284" text-anchor="middle" class="s">Conceptual model aligned to package boundaries · not a runtime-generated trace</text></svg>