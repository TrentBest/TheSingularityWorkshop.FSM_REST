<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Resource, representation, HTTP exchange, and interpretation</title><desc id="desc">Conceptual teaching diagram distinguishing resource identity from its representation and the consumer's interpretation.</desc><defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#18212f}.h{font-size:20px;font-weight:700}.b{font-size:15px}.s{font-size:13px;fill:#465466}.n{fill:#f5f8fc;stroke:#58799d;stroke-width:2}.g{fill:#e2f2ed;stroke:#2f806b;stroke-width:2}.l{stroke:#58799d;stroke-width:2.5;fill:none}.p{fill:#2f806b;animation:travel 5s ease-in-out infinite}@keyframes travel{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(760px);opacity:0}}@media(prefers-reduced-motion:reduce){.p{animation:none;display:none}}</style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#58799d"/></marker></defs><rect x="20" y="48" width="210" height="150" rx="14" class="n"/><text x="125" y="82" text-anchor="middle" class="h">Resource</text><text x="125" y="112" text-anchor="middle" class="b">Course CS101</text><text x="125" y="142" text-anchor="middle" class="s">Conceptual identity</text><text x="125" y="164" text-anchor="middle" class="s">may outlive one view</text><path d="M230 123H270" class="l" marker-end="url(#a)"/><rect x="278" y="48" width="210" height="150" rx="14" class="g"/><text x="383" y="82" text-anchor="middle" class="h">Representation</text><text x="383" y="112" text-anchor="middle" class="b">JSON or another format</text><text x="383" y="142" text-anchor="middle" class="s">Transferable view</text><text x="383" y="164" text-anchor="middle" class="s">of selected information</text><path d="M488 123H528" class="l" marker-end="url(#a)"/><rect x="536" y="48" width="210" height="150" rx="14" class="n"/><text x="641" y="82" text-anchor="middle" class="h">HTTP exchange</text><text x="641" y="112" text-anchor="middle" class="b">Method + URI</text><text x="641" y="142" text-anchor="middle" class="s">Headers + optional body</text><text x="641" y="164" text-anchor="middle" class="s">Status + response metadata</text><path d="M746 123H786" class="l" marker-end="url(#a)"/><rect x="794" y="48" width="186" height="150" rx="14" class="g"/><text x="887" y="82" text-anchor="middle" class="h">Consumer</text><text x="887" y="112" text-anchor="middle" class="b">Parse + interpret</text><text x="887" y="142" text-anchor="middle" class="s">Validate domain meaning</text><text x="887" y="164" text-anchor="middle" class="s">before acting</text><path d="M90 232H900" class="l" stroke-dasharray="6 6"/><circle cx="0" cy="232" r="7" class="p"/><text x="500" y="276" text-anchor="middle" class="s">Conceptual teaching model · animation indicates flow, not live traffic</text></svg>