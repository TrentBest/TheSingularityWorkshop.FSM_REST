<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Network timeout and uncertain remote outcome</title><desc id="desc">A conceptual timeline in which the caller times out while the server may still be processing or may already have committed a change.</desc><defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#18212f}.h{font-size:20px;font-weight:700}.b{font-size:15px}.s{font-size:13px;fill:#465466}.l{stroke:#2875a7;stroke-width:4;fill:none}.r{stroke:#2f806b;stroke-width:4;fill:none;stroke-dasharray:7 6}.c{fill:#fff0d9;stroke:#b16c16;stroke-width:2}.g{fill:#e2f2ed;stroke:#2f806b;stroke-width:2}.p{fill:#2875a7;animation:send 4s linear infinite}.q{fill:#2f806b;animation:reply 4s linear infinite}@keyframes send{0%{transform:translate(0,0);opacity:0}10%{opacity:1}45%{transform:translate(400px,0);opacity:1}55%,100%{opacity:0}}@keyframes reply{0%,50%{transform:translate(0,0);opacity:0}60%{opacity:1}90%{transform:translate(-400px,0);opacity:1}100%{opacity:0}}@media(prefers-reduced-motion:reduce){.p,.q{animation:none;display:none}}</style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#2875a7"/></marker></defs><text x="40" y="36" class="h">One request, multiple possible realities</text><rect x="40" y="62" width="175" height="80" rx="12" class="c"/><text x="127" y="92" text-anchor="middle" class="h">Caller</text><text x="127" y="118" text-anchor="middle" class="b">Waits for result</text><rect x="785" y="62" width="175" height="80" rx="12" class="g"/><text x="872" y="92" text-anchor="middle" class="h">Server</text><text x="872" y="118" text-anchor="middle" class="b">May commit work</text><path d="M215 95H785" class="l" marker-end="url(#a)"/><circle cx="0" cy="95" r="7" class="p"/><path d="M785 128H215" class="r"/><circle cx="0" cy="128" r="7" class="q"/><path d="M420 55V174" stroke="#b16c16" stroke-width="2" stroke-dasharray="5 5"/><text x="420" y="195" text-anchor="middle" class="b">Caller timeout</text><rect x="40" y="218" width="920" height="65" rx="12" fill="#f5f8fc" stroke="#9aa9ba" stroke-width="2"/><text x="62" y="244" class="h">What the caller knows</text><text x="62" y="268" class="b">No timely response was observed. The remote effect remains unknown until reconciled.</text><text x="500" y="307" text-anchor="middle" class="s">Conceptual illustration · not a measured timing trace</text></svg>