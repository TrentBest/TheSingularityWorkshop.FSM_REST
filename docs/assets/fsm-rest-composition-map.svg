<text x="65" y="72" fill="#fff" font-family="Segoe UI,Arial" font-size="38" font-weight="700">Many descriptions. One composition surface.</text>
<text x="65" y="108" fill="#9fb2c8" font-family="Segoe UI,Arial" font-size="19">Protocol-specific knowledge stays at the edge; the Workshop consumes a neutral capability form.</text>
