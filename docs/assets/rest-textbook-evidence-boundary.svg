<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">The REST evidence boundary</title>
<desc id="desc">A conceptual teaching model separates a declared capability, constructed request, observed transport or HTTP outcome, and domain validation. A dashed boundary emphasizes that each layer supports only specific claims.</desc>
<defs>
<style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#18212f}.h{font-size:19px;font-weight:700}.b{font-size:14px}.s{font-size:12px;fill:#465466}.n{fill:#f5f8fc;stroke:#58799d;stroke-width:2}.g{fill:#e2f2ed;stroke:#2f806b;stroke-width:2}.y{fill:#fff0d9;stroke:#b16c16;stroke-width:2}.l{stroke:#58799d;stroke-width:2.5;fill:none}.p{fill:#b16c16;animation:travel 7s ease-in-out infinite}@keyframes travel{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(770px);opacity:0}}@media(prefers-reduced-motion:reduce){.p{animation:none;display:none}}
</style>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6Z" fill="#58799d"/></marker>
</defs>
<text x="34" y="34" class="h">Evidence does not automatically cross the next boundary</text>
<rect x="24" y="60" width="220" height="126" rx="13" class="n"/>
<text x="134" y="91" text-anchor="middle" class="h">Declared</text>
<text x="134" y="119" text-anchor="middle" class="b">Descriptor + binding</text>
<text x="134" y="145" text-anchor="middle" class="s">What we intend to ask</text>
<text x="134" y="165" text-anchor="middle" class="s">No proof of delivery</text>
<path d="M244 123H270" class="l" marker-end="url(#arrow)"/>
<rect x="278" y="60" width="220" height="126" rx="13" class="n"/>
<text x="388" y="91" text-anchor="middle" class="h">Constructed / sent</text>
<text x="388" y="119" text-anchor="middle" class="b">Request + transport call</text>
<text x="388" y="145" text-anchor="middle" class="s">What the client prepared</text>
<text x="388" y="165" text-anchor="middle" class="s">No proof of remote effect</text>
<path d="M498 123H524" class="l" marker-end="url(#arrow)"/>
<rect x="532" y="60" width="220" height="126" rx="13" class="y"/>
<text x="642" y="91" text-anchor="middle" class="h">Observed</text>
<text x="642" y="119" text-anchor="middle" class="b">Transport result / HTTP</text>
<text x="642" y="145" text-anchor="middle" class="s">What came back—or didn't</text>
<text x="642" y="165" text-anchor="middle" class="s">Not a domain verdict</text>
<path d="M752 123H778" class="l" marker-end="url(#arrow)"/>
<rect x="786" y="60" width="190" height="126" rx="13" class="g"/>
<text x="881" y="91" text-anchor="middle" class="h">Validated</text>
<text x="881" y="119" text-anchor="middle" class="b">Domain rules</text>
<text x="881" y="145" text-anchor="middle" class="s">Meaning for this app</text>
<text x="881" y="165" text-anchor="middle" class="s">Requires explicit checks</text>
<path d="M58 230H940" class="l" stroke-dasharray="7 6"/>
<circle cx="0" cy="230" r="7" class="p"/>
<rect x="24" y="250" width="952" height="58" rx="11" fill="#fff0d9" stroke="#b16c16" stroke-width="2"/>
<text x="45" y="274" class="h">Uncertain outcome?</text>
<text x="45" y="295" class="b">Reconcile with a service contract before claiming success, failure, or safe retry.</text>
<text x="500" y="330" text-anchor="middle" class="s">Conceptual teaching model · animated marker is not runtime telemetry</text>
</svg>
